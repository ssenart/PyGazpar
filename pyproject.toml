[project]
name = "pygazpar"
version = "1.4.0a6"
description = "Python library to download gas consumption from a GrDF (French Gas Company) account"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Stéphane Senart" }
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "openpyxl>=3.1.5,<4.0.0",
    "requests>=2.32.3,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pydantic>=2.10.6,<3.0.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12.0,<1.0.0",
]

[project.scripts]
pygazpar = "pygazpar.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "mypy>=2.4.0,<3.0.0",
    "ruff>=0.16.10,<0.17.0",
    "types-openpyxl>=3.1.5,<4.0.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.0"

[tool.uv.build-backend]
module-name = "pygazpar"
module-root = ""
source-include = ["CHANGELOG.md"]

[tool.mypy]
exclude = [ ".venv" ]

[tool.ruff]
exclude = [ ".venv", "*.md" ]
line-length = 120

[tool.ruff.lint]
# E501 is ignored: ruff format owns the line length, and long strings are left as they are.
select = ["E", "F", "W", "I", "N", "B", "UP", "ARG", "RET", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The samples are scripts named after what they show.
"samples/*" = ["N999"]
